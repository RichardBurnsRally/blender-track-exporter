name: Site

# The Pages site is the book plus the Blender extension repository index, rebuilt from the releases
# (pre-releases included).
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Release events run on the tag; the book still comes from main.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || '' }}
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: 0.5.3
      - run: mdbook build docs
      - name: extension repository index
        env:
          GH_TOKEN: ${{ github.token }}
          # A just-published release can take a few seconds to show up as published in the releases list.
          WAIT_FOR: ${{ github.event_name == 'release' && github.event.action != 'deleted' && github.event.release.tag_name || '' }}
        run: |
          set -o pipefail
          list() {
            gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
              --jq '.[] | select(.draft | not) | [.published_at, .tag_name] | @tsv' | sort > releases.tsv
          }
          list
          for _ in $(seq 12); do
            [ -z "$WAIT_FOR" ] || cut -f2 releases.tsv | grep -qxF "$WAIT_FOR" && break
            echo "waiting for $WAIT_FOR to be listed"
            sleep 5
            list
          done
          if [ -n "$WAIT_FOR" ] && ! cut -f2 releases.tsv | grep -qxF "$WAIT_FOR"; then
            echo "error: $WAIT_FOR is not listed as published" >&2
            exit 1
          fi
          echo '{"version": "v1", "blocklist": [], "data": []}' > docs/book/index.json
          while IFS=$'\t' read -r _ tag; do
            rm -rf zips && mkdir zips
            gh release download "$tag" -R "$GITHUB_REPOSITORY" -p '*.zip' -D zips
            base="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag"
            python3 scripts/extension-index.py --index docs/book/index.json --base-url "$base" zips/*.zip
          done < releases.tsv
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
